<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リトルパレット英語アート教室</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a1a;
    --text: #333;
    --muted: #666;
    --line: #dcdcdc;
    --paper: #fff;
    --page: #f3f0f2;
    --accent: #b0416a;
    --error: #b0283c;
    --pink: rgba(242, 160, 190, .75);
    --aqua: rgba(150, 225, 220, .7);
    --orchid: rgba(232, 165, 222, .5);
    --butter: rgba(248, 226, 150, .55);
    --serif-en: "Cormorant Garamond", "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --mincho: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; font-variant-numeric: lining-nums; }
  body {
    margin: 0; background: var(--page); color: var(--text);
    font-family: var(--sans); font-size: 15px; line-height: 1.9; letter-spacing: .04em;
  }
  button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  h1, h2, h3 { margin: 0; font-family: var(--mincho); font-weight: 500; color: var(--ink); line-height: 1.5; letter-spacing: .08em; }
  p { margin: 0; }
  ul, ol { margin: 0; padding: 0; }

  /* ---------- Portfolio demo strip (not part of the designed site) ---------- */
  .demo {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px 14px;
    padding: 6px 16px; background: #e6e2e4; border-bottom: 1px solid #d3cdd0; color: var(--muted);
    font-size: 12px; line-height: 1.6; letter-spacing: .04em; text-align: center;
  }
  .demo a { color: var(--ink); text-underline-offset: 3px; white-space: nowrap; padding: 4px 0; }

  /* ---------- Device frame ---------- */
  .frame { max-width: 430px; margin: 0 auto; background: var(--paper); min-height: 100vh; position: relative; overflow: hidden; }
  .frame.wide { max-width: 720px; }
  @media (min-width: 480px) {
    .frame { margin: 24px auto 48px; min-height: auto; box-shadow: 0 20px 60px rgba(0, 0, 0, .08); }
  }

  /* Watercolor-like gradient wash */
  .mesh {
    background:
      radial-gradient(60% 45% at 12% 88%, var(--pink), transparent 70%),
      radial-gradient(55% 45% at 92% 72%, var(--aqua), transparent 70%),
      radial-gradient(45% 35% at 62% 6%, var(--orchid), transparent 70%),
      radial-gradient(40% 30% at 22% 28%, var(--butter), transparent 70%),
      var(--paper);
  }

  /* ---------- Header ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 14px 20px; position: sticky; top: 0; z-index: 5;
    background: rgba(255, 255, 255, .82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .brand { font-family: var(--serif-en); font-weight: 500; font-size: 17px; letter-spacing: .24em; line-height: 1.2; color: var(--ink); }
  .brand small { display: block; font-family: var(--sans); font-size: 10px; letter-spacing: .12em; color: var(--muted); margin-top: 2px; }
  .lang { display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0; font-size: 12px; }
  .lang button { border: 0; background: transparent; padding: 4px 6px; min-height: 36px; color: var(--muted); border-bottom: 1px solid transparent; }
  .lang button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .lang .sep { color: var(--line); }

  /* ---------- Sections ---------- */
  .section { padding: 56px 24px; position: relative; }
  .section h2 { font-size: 23px; margin-bottom: 24px; }
  .eyebrow {
    display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
    font-family: var(--serif-en); font-size: 14px; font-style: italic; letter-spacing: .16em; color: var(--accent);
  }
  .eyebrow::before { content: ""; width: 28px; height: 1px; background: currentColor; }
  .eyebrow .no { font-style: normal; }
  .muted { color: var(--muted); font-size: 13px; }
  .small { font-size: 12px; }
  .stack > * + * { margin-top: 16px; }

  /* Image placeholders */
  .ph {
    border: 1px solid var(--line);
    background: linear-gradient(135deg, #fafafa, #efefef);
    display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--muted); font-size: 11px; padding: 16px; letter-spacing: .06em;
  }
  .ph span::before { content: "IMAGE — "; font-family: var(--serif-en); letter-spacing: .2em; }

  /* Buttons */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 58px; padding: 14px 20px; border: 1px solid var(--ink);
    background: var(--ink); color: #fff; font-family: var(--sans); font-weight: 500; font-size: 15px; letter-spacing: .14em;
    transition: background .2s, color .2s;
  }
  .btn:hover { background: #fff; color: var(--ink); }
  .btn.secondary { background: transparent; color: var(--ink); }
  .btn.secondary:hover { background: var(--ink); color: #fff; }
  .btn[disabled], .btn[disabled]:hover { background: #ececec; border-color: #ececec; color: #999; cursor: not-allowed; }
  .link { background: none; border: 0; padding: 8px 0; color: var(--muted); font-size: 13px; min-height: 40px; text-decoration: underline; text-underline-offset: 4px; }

  /* Hero */
  .hero { padding: 32px 24px 0; position: relative; }
  .hero .vlabel {
    position: absolute; right: 14px; top: 40px; writing-mode: vertical-rl;
    font-family: var(--serif-en); font-size: 12px; letter-spacing: .3em; color: var(--ink); text-transform: uppercase;
  }
  .hero .kicker { font-family: var(--serif-en); font-size: 15px; letter-spacing: .3em; text-transform: uppercase; color: var(--ink); }
  .hero h1 { font-size: 30px; line-height: 1.6; margin: 18px 0 20px; padding-right: 24px; }
  .hero .lead { font-size: 14px; padding-right: 24px; }
  .hero-ph { aspect-ratio: 4 / 3; margin: 28px -24px 0 48px; border: 1px solid rgba(26,26,26,.18); border-right: 0; background: linear-gradient(160deg, rgba(255,255,255,.92), rgba(255,255,255,.6)); color: var(--text); }
  .marquee { overflow: hidden; white-space: nowrap; margin: -40px 0 0; position: relative; pointer-events: none; }
  .marquee span {
    display: inline-block; padding-right: 40px; font-family: var(--serif-en); font-size: 64px; font-weight: 500; letter-spacing: .08em; line-height: 1.1;
    color: transparent; -webkit-text-stroke: 1px rgba(26, 26, 26, .35);
    animation: drift 28s linear infinite;
  }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-100%); } }
  @media (prefers-reduced-motion: reduce) { .marquee span { animation: none; } }
  .hero .cta-wrap { padding: 24px 0 48px; }
  .hero .cta-wrap p { text-align: center; margin-top: 12px; }

  .concept-text { font-family: var(--mincho); font-size: 16px; line-height: 2.2; color: var(--ink); }

  /* Facts */
  .facts { margin: 0; border-top: 1px solid var(--ink); }
  .facts div { display: grid; grid-template-columns: 7.5em 1fr; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; color: var(--ink); font-weight: 500; }

  /* Support — numbered circles */
  .support li { list-style: none; display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: start; }
  .support li + li { margin-top: 24px; }
  .support .num {
    width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--ink);
    display: flex; align-items: center; justify-content: center; font-family: var(--serif-en); font-size: 20px; color: var(--ink);
  }
  .support li:first-child .num { background: var(--ink); color: #fff; }
  .support p { padding-top: 6px; }

  .checklist li { list-style: none; padding: 12px 0 12px 22px; position: relative; border-bottom: 1px solid var(--line); font-size: 14px; }
  .checklist li::before { content: ""; position: absolute; left: 2px; top: 23px; width: 8px; height: 1px; background: var(--ink); }

  /* Works */
  .works { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .works .ph { aspect-ratio: 3 / 4; }
  .works .ph:nth-child(1) { grid-column: 1 / -1; aspect-ratio: 16 / 10; }
  .hero-img { margin: 28px -24px 0 48px; position: relative; }
  .hero-img img { display: block; width: 100%; height: auto; }
  .work { margin: 0; min-width: 0; }
  .work img { display: block; width: 100%; height: auto; }
  .works.has-images .work:first-child { grid-column: 1 / -1; }
  .works-cap { font-family: var(--serif-en); font-style: italic; font-size: 13px; color: var(--muted); margin-top: 12px; }

  /* Flow */
  .flow li { list-style: none; display: grid; grid-template-columns: 48px 1fr; gap: 12px; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .flow li:first-child { border-top: 1px solid var(--ink); }
  .flow .n { font-family: var(--serif-en); font-size: 28px; line-height: 1.1; color: var(--ink); }
  .flow strong { display: block; font-family: var(--mincho); font-weight: 500; color: var(--ink); }

  /* Regular lessons */
  .course { border-top: 1px solid var(--ink); padding-top: 18px; }
  .course + .course { margin-top: 36px; }
  .courses + .facts { margin-top: 36px; }
  .course-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .course h3 { font-size: 17px; }
  .course .price { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .course .price b { font-family: var(--serif-en); font-size: 30px; font-weight: 500; color: var(--ink); letter-spacing: .02em; margin: 0 2px; }
  .course .times { margin: 10px 0 0; }
  .course .times div { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .course .times dt { font-size: 13px; color: var(--muted); }
  .course .times dd { margin: 0; font-family: var(--serif-en); font-size: 21px; font-weight: 500; color: var(--ink); letter-spacing: .04em; }

  /* Booking card */
  .card { background: rgba(255, 255, 255, .92); padding: 28px 22px; }

  /* FAQ */
  details.faq { border-bottom: 1px solid var(--line); }
  details.faq:first-of-type { border-top: 1px solid var(--ink); }
  details.faq summary { padding: 18px 36px 18px 30px; cursor: pointer; list-style: none; position: relative; font-size: 14px; color: var(--ink); }
  details.faq summary::-webkit-details-marker { display: none; }
  details.faq summary::before { content: "Q."; position: absolute; left: 0; top: 15px; font-family: var(--serif-en); font-size: 19px; color: var(--accent); }
  details.faq summary::after { content: ""; position: absolute; right: 6px; top: 50%; width: 12px; height: 1px; background: var(--ink); box-shadow: none; }
  details.faq:not([open]) summary::before { }
  details.faq summary .pm { position: absolute; right: 11px; top: 50%; width: 1px; height: 12px; margin-top: -6px; background: var(--ink); }
  details.faq[open] summary .pm { display: none; }
  details.faq p { padding: 0 0 18px 30px; color: var(--muted); font-size: 13px; }

  .footer { padding: 48px 24px 40px; text-align: center; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
  .footer .brand { margin-bottom: 18px; }
  .footer .ig { display: inline-block; font-family: var(--serif-en); letter-spacing: .24em; font-size: 13px; color: var(--ink); border-bottom: 1px solid var(--ink); margin-bottom: 20px; }

  /* Steps */
  .steps { display: flex; padding: 28px 24px 22px; counter-reset: st; }
  .steps li { list-style: none; flex: 1; text-align: center; font-size: 11px; color: var(--muted); position: relative; }
  .steps li::before {
    counter-increment: st; content: "0" counter(st); display: flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; margin: 0 auto 6px; border-radius: 50%; border: 1px solid #bbb; background: rgba(255,255,255,.85);
    font-family: var(--serif-en); font-size: 15px; color: var(--muted); position: relative; z-index: 1;
  }
  .steps li:not(:last-child)::after { content: ""; position: absolute; top: 19px; left: calc(50% + 19px); right: calc(-50% + 19px); height: 1px; background: #bbb; }
  .steps li.on { color: var(--ink); font-weight: 500; }
  .steps li.on::before { background: var(--ink); border-color: var(--ink); color: #fff; }
  .steps li.past::before { border-color: var(--ink); color: var(--ink); }

  /* Slots */
  .day + .day { margin-top: 32px; }
  .day h3 { font-size: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--ink); }
  .slot {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; text-align: left; min-height: 64px; padding: 10px 4px; background: transparent;
    border: 0; border-bottom: 1px solid var(--line); transition: background .15s, padding .15s;
  }
  .slot .time { font-family: var(--serif-en); font-size: 24px; font-weight: 500; color: var(--ink); letter-spacing: .04em; }
  .slot .status { font-size: 12px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .slot:not(.full) .status::after { content: "→"; font-family: var(--serif-en); font-size: 16px; }
  .slot[aria-pressed="true"] { background: var(--ink); padding-left: 16px; padding-right: 16px; }
  .slot[aria-pressed="true"] .time, .slot[aria-pressed="true"] .status { color: #fff; }
  .slot[aria-pressed="true"] .status::after { content: ""; }
  .slot.full { cursor: not-allowed; }
  .slot.full .time { color: #b5b5b5; text-decoration: line-through; text-decoration-thickness: 1px; }
  .slot.full .status { color: #999; border: 1px solid #ccc; padding: 0 8px; }
  .legend { display: flex; gap: 20px; font-size: 11px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 18px; height: 1px; background: var(--ink); margin-right: 6px; vertical-align: 4px; }
  .legend span.l-full::before { background: #c5c5c5; }
  .sticky-cta { position: sticky; bottom: 0; background: rgba(255,255,255,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 12px 24px calc(14px + env(safe-area-inset-bottom)); z-index: 4; }
  .sticky-cta .picked { font-size: 12px; margin-bottom: 8px; text-align: center; color: var(--muted); }

  .notice { border-left: 2px solid var(--ink); padding: 8px 14px; font-size: 13px; background: #f6f6f6; }
  .notice.error { border-left-color: var(--error); color: var(--error); background: #fbf1f3; }

  /* Form */
  .summary-card { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 6px 0; }
  .summary-card .row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 10px 0; }
  .summary-card .row + .row { border-top: 1px solid var(--line); }
  .summary-card .row span { color: var(--muted); }
  .summary-card .row b { text-align: right; font-weight: 500; color: var(--ink); }
  .field { margin-top: 28px; }
  .field label { display: block; font-size: 13px; color: var(--ink); margin-bottom: 4px; }
  .req { font-size: 10px; color: var(--accent); margin-left: 8px; letter-spacing: .1em; }
  .field input, .field select {
    width: 100%; min-height: 50px; padding: 10px 2px; border: 0; border-bottom: 1px solid #999; border-radius: 0; background: transparent; font-size: 16px;
    -webkit-appearance: none; appearance: none;
  }
  .field select { background: linear-gradient(45deg, transparent 50%, var(--ink) 50%) right 8px center / 6px 6px no-repeat, linear-gradient(-45deg, transparent 50%, var(--ink) 50%) right 2px center / 6px 6px no-repeat; }
  .field input:focus, .field select:focus { outline: none; border-bottom: 2px solid var(--ink); }
  .field .hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .field .err { display: none; font-size: 12px; margin-top: 6px; color: var(--error); }
  .field .err::before { content: "— "; }
  .field.invalid input, .field.invalid select { border-bottom: 2px solid var(--error); background-color: #fbf1f3; }
  .field.invalid .err { display: block; }

  /* Done */
  .done-mark {
    width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--ink);
    display: flex; align-items: center; justify-content: center; font-family: var(--serif-en); font-size: 13px; letter-spacing: .14em; color: var(--ink); background: rgba(255,255,255,.8);
  }

  /* Staff */
  .staff-head { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--ink); color: #fff; }
  .staff-head .brand { color: #fff; font-family: var(--sans); letter-spacing: .1em; font-size: 15px; }
  .staff-head .brand small { color: #bbb; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; background: #fff; border: 0; border-bottom: 2px solid transparent; padding: 12px 8px; min-height: 50px; color: var(--muted); }
  .tabs button[aria-selected="true"] { border-bottom-color: var(--ink); color: var(--ink); font-weight: 500; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--line); }
  .stats div { padding: 12px 6px; text-align: center; }
  .stats div + div { border-left: 1px solid var(--line); }
  .stats b { display: block; font-family: var(--serif-en); font-size: 30px; font-weight: 500; color: var(--ink); line-height: 1.2; }
  .stats span { font-size: 11px; color: var(--muted); }
  .bk-group h3 { font-family: var(--sans); font-size: 13px; color: var(--muted); margin: 24px 0 6px; letter-spacing: .04em; }
  .bk-row {
    width: 100%; display: grid; grid-template-columns: 4.2em 1fr auto; gap: 8px; align-items: center; text-align: left;
    padding: 12px 8px; border: 0; border-bottom: 1px solid var(--line); background: #fff; min-height: 58px;
  }
  .bk-row[aria-expanded="true"] { background: #f6f6f6; border-bottom-color: transparent; }
  .bk-row .t { font-family: var(--serif-en); font-size: 19px; color: var(--ink); }
  .bk-row .n { color: var(--ink); }
  .bk-row .n small { display: block; color: var(--muted); font-size: 11px; }
  .badge { font-size: 10px; border: 1px solid var(--ink); padding: 1px 8px; white-space: nowrap; }
  .badge.solid { background: var(--ink); color: #fff; }
  .chev { font-size: 10px; color: var(--muted); }
  .bk-detail { background: #f6f6f6; padding: 4px 14px 16px; font-size: 13px; border-bottom: 1px solid var(--ink); }
  .bk-detail dl { margin: 0; display: grid; grid-template-columns: 7.5em 1fr; gap: 6px 8px; }
  .bk-detail dt { color: var(--muted); }
  .bk-detail dd { margin: 0; word-break: break-all; color: var(--ink); }
  .slot-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .slot-table th, .slot-table td { border-bottom: 1px solid var(--line); padding: 10px 4px; text-align: left; }
  .slot-table th { font-size: 11px; color: var(--muted); font-weight: 400; border-bottom: 1px solid var(--ink); }
  .slot-table tr.new td { background: #f6f6f6; color: var(--ink); font-weight: 500; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 18px; font-size: 13px; z-index: 50; max-width: calc(100% - 32px);
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Screen tops on booking pages get a light wash */
  .steps { background:
      radial-gradient(70% 120% at 0% 100%, var(--pink), transparent 70%),
      radial-gradient(60% 120% at 100% 80%, var(--aqua), transparent 70%),
      radial-gradient(50% 100% at 55% 0%, var(--butter), transparent 70%), #fff; }

  /* ---------- Desktop (parent view): photos / content / page menu ---------- */
  .desk-left, .desk-right { display: none; }
  [tabindex="-1"]:focus { outline: none; }

  @media (min-width: 1200px) {
    .frame.parent {
      display: grid; grid-template-columns: minmax(280px, 1fr) minmax(0, 600px) minmax(280px, 1fr);
      max-width: none; min-height: 100vh; margin: 0; box-shadow: none; overflow: visible; background: transparent;
    }
    .desk-main { min-width: 0; background: var(--paper); box-shadow: 0 20px 60px rgba(0, 0, 0, .08); }
    .desk-main .topbar { display: none; }
    .desk-left, .desk-right {
      display: flex; flex-direction: column; justify-content: space-between;
      position: sticky; top: 0; height: 100vh; padding: 36px clamp(32px, 3.4vw, 64px) 44px;
    }

    /* Left: brand + photo slideshow */
    .desk-left { align-items: center; }
    .desk-left .brand { align-self: flex-start; }
    .desk-visual { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .desk-photo {
      position: relative; margin: 0; width: min(72%, 270px); aspect-ratio: 4 / 5; overflow: hidden; background: var(--paper);
      border-radius: 999px 999px 18px 18px; border: 1px solid rgba(26, 26, 26, .16);
      box-shadow: 12px 12px 0 rgba(150, 225, 220, .55);
    }
    .desk-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.2s ease; }
    .desk-photo img.on { opacity: 1; }
    .slide-ctrl { display: flex; align-items: center; justify-content: center; margin-top: 30px; }
    .slide-ctrl .dot-btn { width: 26px; height: 32px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; }

  var state;
  try { state = JSON.parse(sessionStorage.getItem(STORE_KEY)); } catch (e) { state = null; }
  if (!state || !state.slots) state = seed();
  function save() { try { sessionStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }

  /* ================= Parent screens ================= */
  function steps(current) {
    var keys = ['stepSlot', 'stepForm', 'stepDone'];
    return '<ol class="steps">' + keys.map(function (k, i) {
      var cls = i === current ? 'on' : i < current ? 'past' : '';

    }).join('') + '</ol>';
  }

    '<dl class="facts">' +

  /* Desktop side panels (hidden below 1200px by CSS) */

  /* Slideshow: advances without re-rendering, so the rest of the page is untouched. */
  var slideIdx = 0;
  var slidePaused = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function showSlide(i) {
    slideIdx = (i + SLIDES.length) % SLIDES.length;
    app.querySelectorAll('.desk-photo img').forEach(function (img, k) {
      img.classList.toggle('on', k === slideIdx);
      if (k === slideIdx) img.removeAttribute('aria-hidden'); else img.setAttribute('aria-hidden', 'true');
    });
    app.querySelectorAll('.slide-ctrl .dot-btn').forEach(function (b, k) {
      if (k === slideIdx) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');
    });
  }
  setInterval(function () {
    if (slidePaused || document.hidden || state.view !== 'parent' || SLIDES.length < 2) return;
    showSlide(slideIdx + 1);
  }, SLIDE_MS);

  function imgTag(img, lazy) {
    return '<img src="' + esc(img.src) + '" width="' + img.w + '" height="' + img.h + '" alt="' + esc(img.alt[state.lang]) + '"' +

        return imgs[i] ? '<figure class="work">' + imgTag(imgs[i], true) + '</figure>' : '<div class="ph"><span>' + esc(w) + '</span></div>';

        '<h1>' + esc(L.heroTitle).replace('、', '、<br>').replace(', ', ',<br>') + '</h1>' +
        '<p class="lead">' + esc(t('heroLead', { min: AGE_MIN, max: AGE_MAX })) + '</p>' +
        heroMedia(L) +
        '<div class="marquee" aria-hidden="true"><span>' + marquee + '</span><span>' + marquee + '</span></div>' +
        '<div class="cta-wrap">' +
          '<button type="button" class="btn" data-action="go" data-screen="slots">' + esc(L.ctaSlots) + ' →</button>' +
          '<p class="muted">' + esc(L.ctaSub) + '</p>' +
        '</div>' +
      '</section>' +
      '<section class="section" id="concept">' + head('Concept', L.conceptTitle) +
        '<p class="concept-text">' + esc(L.conceptBody) + '</p>' +
      '</section>' +
      '<section class="section mesh" id="support">' + head('Support', L.supportTitle) + '<ol class="support">' +
        L.support.map(function (s, i) { return '<li><span class="num">0' + (i + 1) + '</span><p>' + esc(s) + '</p></li>'; }).join('') + '</ol></section>' +
      '<section class="section" id="trial">' + head('Trial Lesson', L.factsTitle) + factsList() + '</section>' +
      '<section class="section" id="gallery">' + head('Gallery', L.worksTitle) + worksMedia(L) +
        '<p class="works-cap">Works by our students</p></section>' +
      '<section class="section" id="flow">' + head('Flow', L.flowTitle) + '<ol class="flow">' +
        L.flow.map(function (f, i) { return '<li><span class="n">0' + (i + 1) + '</span><div><strong>' + esc(f[0]) + '</strong><span class="muted">' + esc(f[1]) + '</span></div></li>'; }).join('') + '</ol></section>' +
      '<section class="section" id="lessons">' + head('Regular Lessons', L.regularTitle) + regularLessons(L) + '</section>' +
      '<section class="section mesh" id="booking"><div class="card stack">' + head('Booking', L.trialTitle) +
        '<p>' + esc(L.trialBody) + '</p>' +
        '<div class="summary-card">' +
          '<div class="row"><span>' + esc(L.fDur) + '</span><b>' + t('vDur', { n: DURATION_MIN }) + '</b></div>' +
          '<div class="row"><span>' + esc(L.fFee) + '</span><b>' + esc(t('feeVal', { fee: yen(FEE_YEN) })) + '</b></div>' +
          '<div class="row"><span>' + esc(L.fParent) + '</span><b>' + esc(L.vParent) + '</b></div>' +

      '</div></section>' +

      '</section>' +
      '<footer class="footer">' +
        '<div class="brand">LITTLE PALETTE<small>' + esc(t('brand')) + '</small></div>' +
        '<span class="ig">INSTAGRAM</span>' +
        '<p>' + esc(L.footer) + '</p>' +
      '</footer>';
  }

  function renderSlots() {
    var L = T[state.lang];
    var today = todayIso();
    var list = state.slots.filter(bookable).sort(bySlot);
    var groups = {};
    var order = [];
    list.forEach(function (s) { if (!groups[s.date]) { groups[s.date] = []; order.push(s.date); } groups[s.date].push(s); });
    var sel = state.selectedSlotId && findSlot(state.selectedSlotId);
    if (sel && remaining(sel) === 0) sel = null;

    var body = order.length ? order.map(function (date) {
      return '<div class="day"><h3>' + esc(fmtDate(date, state.lang)) + '</h3>' +
        groups[date].map(function (s) {
          var left = remaining(s);
          var full = left === 0;
          var picked = sel && sel.id === s.id;
          return '<button type="button" class="slot' + (full ? ' full' : '') + '" ' +
            (full ? 'disabled aria-disabled="true"' : 'data-action="pick" data-id="' + s.id + '" aria-pressed="' + !!picked + '"') + '>' +
            '<span class="time">' + esc(timeRange(s, state.lang)) + '</span>' +
            '<span class="status">' + (full ? esc(L.full) : picked ? '✓ ' + esc(L.selected) : esc(t('remaining', { n: left }))) + '</span>' +
          '</button>';
        }).join('') + '</div>';
    }).join('') : '<p class="notice">' + esc(L.noSlots) + '</p>';

    return header() + steps(0) +
      '<section class="section stack" style="border-bottom:0">' +
        '<button type="button" class="link" data-action="go" data-screen="intro">' + esc(L.backIntro) + '</button>' +
        '<h1 style="font-size:22px">' + esc(L.slotsTitle) + '</h1>' +
        '<p class="muted">' + esc(t('slotsLead', { n: BOOK_DAYS_BEFORE })) + '</p>' +
        '<p class="small">' + esc(L.fDur) + '：' + t('vDur', { n: DURATION_MIN }) + ' / ' + esc(L.fFee) + '：' + esc(t('feeVal', { fee: yen(FEE_YEN) })) + '</p>' +
        (state.slotTaken ? '<p class="notice error" role="alert">' + esc(L.slotTakenMsg) + '</p>' : '') +
        '<div class="legend"><span>' + esc(L.legendOpen) + '</span><span class="l-full">' + esc(L.legendFull) + '</span></div>' +
        '<div>' + body + '</div>' +
      '</section>' +
      '<div class="sticky-cta">' +
        '<p class="picked" aria-live="polite">' + (sel ? esc(t('picked', { slot: slotLabel(sel, state.lang) })) : esc(L.chooseFirst)) + '</p>' +
        '<button type="button" class="btn" data-action="go" data-screen="form"' + (sel ? '' : ' disabled') + '>' + esc(L.continueBtn) + ' →</button>' +
      '</div>';
  }

  var ERR_KEYS = { name: 'errName', email: 'errEmail', emailFormat: 'errEmailFormat', age: 'errAge' };

  function validateField(field, v) {
    v = (v || '').trim();
    if (field === 'name') return v ? null : 'name';
    if (field === 'email') return !v ? 'email' : isEmail(v) ? null : 'emailFormat';
    if (field === 'age') return v ? null : 'age';
    return null;
  }

  function fieldHtml(field, label, control, hint) {
    var err = state.errors[field];
    return '<div class="field' + (err ? ' invalid' : '') + '" data-fieldwrap="' + field + '">' +
      '<label for="f-' + field + '">' + esc(label) + '<span class="req">' + esc(t('required')) + '</span>' + '</label>' +
      control +
      (hint ? '<p class="hint" id="h-' + field + '">' + esc(hint) + '</p>' : '') +
      '<p class="err" id="e-' + field + '">' + (err ? esc(t(ERR_KEYS[err])) : '') + '</p>' +
    '</div>';
  }

  function renderForm() {
    var L = T[state.lang];
    var slot = findSlot(state.selectedSlotId);
    var f = state.form;
    var nErr = Object.keys(state.errors).length;
    function aria(field, hint) {
      var ids = (hint ? 'h-' + field + ' ' : '') + 'e-' + field;
      return ' aria-describedby="' + ids + '"' + (state.errors[field] ? ' aria-invalid="true"' : '');
    }
    var ageOpts = '<option value="">' + esc(L.agePlaceholder) + '</option>';
    for (var a = AGE_MIN; a <= AGE_MAX; a++) {
      ageOpts += '<option value="' + a + '"' + (String(a) === f.age ? ' selected' : '') + '>' + esc(t('ageOpt', { n: a })) + '</option>';
    }
    return header() + steps(1) +
      '<section class="section" style="border-bottom:0">' +
        '<button type="button" class="link" data-action="go" data-screen="slots">' + esc(L.changeSlot) + '</button>' +
        '<h1 style="font-size:22px;margin:4px 0 12px">' + esc(L.formTitle) + '</h1>' +
        '<div class="summary-card">' +
          '<div class="row"><span>' + esc(L.selectedSlot) + '</span><b>' + esc(slotLabel(slot, state.lang)) + '</b></div>' +
          '<div class="row"><span>' + esc(L.fee) + '</span><b>' + esc(t('feeVal', { fee: yen(FEE_YEN) })) + '</b></div>' +
        '</div>' +

          fieldHtml('name', L.lName, '<input id="f-name" data-field="name" type="text" autocomplete="name" value="' + esc(f.name) + '"' + aria('name') + '>') +
          fieldHtml('email', L.lEmail, '<input id="f-email" data-field="email" type="email" inputmode="email" autocomplete="email" value="' + esc(f.email) + '"' + aria('email', true) + '>', L.emailHint) +
          fieldHtml('age', L.lAge, '<select id="f-age" data-field="age"' + aria('age') + '>' + ageOpts + '</select>') +
          '<div style="margin-top:24px"><button type="submit" class="btn">' + esc(L.submit) + '</button></div>' +
          '<p class="muted small" style="margin-top:8px">' + esc(L.submitNote) + '</p>' +
        '</form>' +
      '</section>';
  }

  function renderDone() {
    var L = T[state.lang];
    var b = findBooking(state.lastBookingId);

    return header() + steps(2) +
      '<section class="section stack">' +

          '<div class="row"><span>' + esc(L.bookingNo) + '</span><b>' + esc(b.id) + '</b></div>' +
          '<div class="row"><span>' + esc(L.dateTime) + '</span><b>' + esc(slotLabel(slot, state.lang)) + '</b></div>' +
          '<div class="row"><span>' + esc(L.child) + '</span><b>' + esc(t('childAge', { n: b.childAge })) + '</b></div>' +

  /* ================= Staff screens (日本語のみ) ================= */
  function renderStaff() {
    var today = todayIso();
    var upcoming = state.bookings.filter(function (b) { var s = findSlot(b.slotId); return s && s.date >= today; });
    var openSlots = state.slots.filter(function (s) { return s.date >= today && remaining(s) > 0; }).length;
    var newCount = state.bookings.filter(function (b) { return b.isNew; }).length;
    return '<header class="staff-head"><div class="brand">スタッフ管理画面<small>' + esc(T.ja.brand) + '</small></div></header>' +
      '<div class="tabs" role="tablist">' +
        '<button type="button" role="tab" data-action="tab" data-tab="list" aria-selected="' + (state.staffTab === 'list') + '">予約一覧</button>' +
        '<button type="button" role="tab" data-action="tab" data-tab="add" aria-selected="' + (state.staffTab === 'add') + '">体験枠の追加</button>' +
      '</div>' +
      '<section class="section" style="border-bottom:0">' +
        '<div class="stats">' +
          '<div><b>' + upcoming.length + '</b><span>今後の予約</span></div>' +
          '<div><b>' + newCount + '</b><span>新着の予約</span></div>' +
          '<div><b>' + openSlots + '</b><span>空きのある枠</span></div>' +
        '</div>' +
        (state.staffTab === 'list' ? staffList(upcoming) : staffAdd()) +
      '</section>';
  }

  function staffList(upcoming) {
    if (!upcoming.length) return '<p class="notice" style="margin-top:16px">今後の予約はありません。</p>';
    upcoming.sort(function (a, b) {
      var c = bySlot(findSlot(a.slotId), findSlot(b.slotId));
      return c || (a.createdAt < b.createdAt ? -1 : 1);
    });
    var html = '<p class="muted small" style="margin-top:16px">日時の早い順。行を押すと詳細を表示します。</p>';
    var currentSlot = null;
    upcoming.forEach(function (b) {
      var s = findSlot(b.slotId);
      if (s.id !== currentSlot) {
        if (currentSlot) html += '</div>';
        currentSlot = s.id;
        html += '<div class="bk-group"><h3>' + esc(fmtDate(s.date, 'ja')) + ' ' + esc(timeRange(s, 'ja')) + '　' + bookedCount(s.id) + '/' + s.capacity + '名' + (remaining(s) === 0 ? '（満席）' : '') + '</h3>';
      }
      var open = state.openBookingId === b.id;
      html += '<button type="button" class="bk-row" data-action="openbk" data-id="' + b.id + '" aria-expanded="' + open + '" aria-controls="d-' + b.id + '">' +
        '<span class="t">' + esc(s.time) + '</span>' +
        '<span class="n">' + esc(b.parentName) + '<small>お子さま ' + esc(b.childAge) + '歳 ・ ' + (b.lang === 'en' ? '英語で予約' : '日本語で予約') + '</small></span>' +
        '<span>' + (b.isNew ? '<span class="badge solid">新規</span> ' : '') + '<span class="chev" aria-hidden="true">' + (open ? '▲' : '▼') + '</span></span>' +
      '</button>';
      if (open) {
        var created = new Date(b.createdAt);
        html += '<div class="bk-detail" id="d-' + b.id + '"><dl>' +
          '<dt>予約番号</dt><dd>' + esc(b.id) + '</dd>' +
          '<dt>状態</dt><dd><span class="badge">確定</span></dd>' +
          '<dt>日時</dt><dd>' + esc(slotLabel(s, 'ja')) + '</dd>' +
          '<dt>保護者名</dt><dd>' + esc(b.parentName) + '</dd>' +
          '<dt>メール</dt><dd>' + esc(b.email) + '</dd>' +
          '<dt>お子さまの年齢</dt><dd>' + esc(b.childAge) + '歳</dd>' +
          '<dt>予約時の言語</dt><dd>' + (b.lang === 'en' ? 'English' : '日本語') + '</dd>' +
          '<dt>受付日時</dt><dd>' + (created.getMonth() + 1) + '/' + created.getDate() + ' ' + pad(created.getHours()) + ':' + pad(created.getMinutes()) + '</dd>' +
          '<dt>同じ枠の人数</dt><dd>' + bookedCount(s.id) + ' / ' + s.capacity + '名</dd>' +
        '</dl></div>';
      }
    });
    if (currentSlot) html += '</div>';
    return html;
  }

  function staffAdd() {
    var f = state.staffForm, e = state.staffErrors;
    var today = todayIso();
    var slots = state.slots.filter(function (s) { return s.date >= today; }).sort(bySlot);
    function sfield(key, label, control, hint) {
      return '<div class="field' + (e[key] ? ' invalid' : '') + '"><label for="sf-' + key + '">' + label + '<span class="req">必須</span></label>' + control +
        (hint ? '<p class="hint">' + hint + '</p>' : '') + '<p class="err" id="se-' + key + '">' + esc(e[key] || '') + '</p></div>';
    }
    return '<form data-form="slot" novalidate style="margin-top:8px">' +
      (state.staffAdded ? '<div class="notice" role="status" style="margin-top:16px">' + esc(state.staffAdded) + ' の枠を追加しました。保護者画面の空き枠に表示されています。' +
        '<div style="margin-top:8px"><button type="button" class="link" data-action="checkparent">保護者画面の空き枠で確認する →</button></div></div>' : '') +
      sfield('date', '日付', '<input id="sf-date" type="date" data-sfield="date" min="' + today + '" value="' + esc(f.date) + '" aria-describedby="se-date">') +
      '<div class="grid2">' +
        sfield('time', '開始時刻', '<input id="sf-time" type="time" step="900" data-sfield="time" value="' + esc(f.time) + '" aria-describedby="se-time">', '終了は自動で' + DURATION_MIN + '分後') +
        sfield('capacity', '定員', '<input id="sf-capacity" type="number" inputmode="numeric" min="1" max="12" data-sfield="capacity" value="' + esc(f.capacity) + '" aria-describedby="se-capacity">', '初期値 ' + DEFAULT_CAPACITY + '名') +
      '</div>' +
      '<div style="margin-top:20px"><button type="submit" class="btn">枠を追加する</button></div>' +
    '</form>' +
    '<h2 style="font-size:16px;margin:28px 0 8px">公開中の枠</h2>' +
    '<table class="slot-table"><thead><tr><th>日付</th><th>時間</th><th>予約/定員</th><th>状態</th></tr></thead><tbody>' +
      slots.map(function (s) {
        var left = remaining(s);
        return '<tr' + (s.isNew ? ' class="new"' : '') + '><td>' + esc(fmtDate(s.date, 'ja')) + '</td><td>' + esc(timeRange(s, 'ja')) + '</td><td>' + bookedCount(s.id) + '/' + s.capacity + '</td><td>' +
          (left === 0 ? '満席' : '残り' + left) + (s.isNew ? '（追加）' : '') + '</td></tr>';
      }).join('') +
    '</tbody></table>';
  }

  /* ================= Render ================= */
  var app = document.getElementById('app');

  /* Portfolio strip above the site: says it's a concept and links between the two views. */
  var demo = document.getElementById('demo');
  function renderDemo() {
    var D = T[state.lang];
    demo.lang = state.lang;
    demo.innerHTML = '<span>' + esc(D.demoNote) + '</span>' + (state.view === 'staff'
      ? '<a href="./" data-action="toparent">' + esc(D.demoParent) + '</a>'
      : '<a href="#staff">' + esc(D.demoStaff) + '</a>');
  }

  function render(opts) {
    opts = opts || {};
    renderDemo();

    if (state.view === 'staff') {
      document.documentElement.lang = 'ja';
      app.classList.add('wide');
      app.classList.remove('parent');
      app.innerHTML = renderStaff();
    } else {
      document.documentElement.lang = state.lang;
      app.classList.remove('wide');
      app.classList.add('parent');
      if (state.screen === 'form' && !(state.selectedSlotId && findSlot(state.selectedSlotId))) state.screen = 'slots';
      var main = state.screen === 'slots' ? renderSlots()
        : state.screen === 'form' ? renderForm()
        : state.screen === 'done' ? renderDone()
        : renderIntro();
      var L = T[state.lang];
      app.innerHTML = deskLeft(L) + '<div class="desk-main">' + main + '</div>' + deskRight(L);
    }
    if (opts.top) window.scrollTo(0, 0);
    watchSections();
    save();
  }

  /* Highlight the desktop menu item for the section in the middle of the screen. */
  var spy = null;
  function markNav(id) {
    app.querySelectorAll('.desk-nav a').forEach(function (a) {
      var on = a.getAttribute('data-target') === id;
      a.classList.toggle('on', on);
      if (on) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
    });
  }
  function watchSections() {
    if (spy) { spy.disconnect(); spy = null; }
    if (state.view !== 'parent' || state.screen !== 'intro') return;
    markNav('top');
    if (!('IntersectionObserver' in window)) return;
    spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) markNav(en.target.id); });
    }, { rootMargin: '-25% 0px -70% 0px' });
    NAV.forEach(function (n) { var s = document.getElementById(n.id); if (s) spy.observe(s); });
  }

  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.hidden = false;
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.hidden = true; }, 2400);
  }

  /* ================= Events ================= */
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-action]');
    if (!el) return;
    var a = el.getAttribute('data-action');

    if (a === 'lang') {
      // Keep the current screen, selected slot and form values; only the language changes.
      state.lang = el.getAttribute('data-lang');
      render();
      // Two switches exist (mobile header, desktop menu); focus the one that is visible.
      var btn = [].filter.call(app.querySelectorAll('[data-action="lang"][data-lang="' + state.lang + '"]'), function (b) { return b.offsetParent; })[0];
      if (btn) btn.focus();
    } else if (a === 'slide') {
      showSlide(+el.getAttribute('data-i'));
    } else if (a === 'slidepause') {
      slidePaused = !slidePaused;
      el.textContent = slidePaused ? T[state.lang].slidePlay : T[state.lang].slidePause;
    } else if (a === 'jump') {
      ev.preventDefault();
      if (state.screen !== 'intro') {
        if (state.screen === 'done') state.lastBookingId = null;
        state.screen = 'intro';
        state.errors = {};
        state.slotTaken = false;
        render();
      }
      var sec = document.getElementById(el.getAttribute('data-target'));
      if (sec) {
        sec.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
        sec.setAttribute('tabindex', '-1');
        sec.focus({ preventScroll: true });
      }
    } else if (a === 'go') {
      var to = el.getAttribute('data-screen');
      if (to === 'form') {
        var s = findSlot(state.selectedSlotId);
        if (!s || remaining(s) === 0 || !bookable(s)) return;
        state.slotTaken = false;
      }
      if (to === 'intro' && state.screen === 'done') state.lastBookingId = null;
      if (to !== 'slots') state.slotTaken = false;
      if (to !== 'form') state.errors = {};
      state.screen = to;
      render({ top: true });
    } else if (a === 'pick') {
      state.selectedSlotId = el.getAttribute('data-id');
      state.slotTaken = false;
      render();
      var picked = app.querySelector('[data-action="pick"][data-id="' + state.selectedSlotId + '"]');
      if (picked) picked.focus({ preventScroll: true });
    } else if (a === 'tab') {
      state.staffTab = el.getAttribute('data-tab');
      render();
    } else if (a === 'openbk') {
      var id = el.getAttribute('data-id');
      state.openBookingId = state.openBookingId === id ? null : id;
      render();
      var row = app.querySelector('[data-action="openbk"][data-id="' + id + '"]');
      if (row) row.focus({ preventScroll: true });
    } else if (a === 'toparent') {
      ev.preventDefault();
      history.pushState(null, '', location.pathname + location.search);
      state.view = 'parent';
      render({ top: true });
    } else if (a === 'checkparent') {
      history.replaceState(null, '', location.pathname + location.search);
      state.view = 'parent';
      state.screen = 'slots';
      state.errors = {};
      render({ top: true });
    }
  });

  function onField(ev) {
    var el = ev.target;
    var field = el.getAttribute && el.getAttribute('data-field');
    if (field) {
      state.form[field] = el.value;
      // Clear the error as soon as the field becomes valid (no full re-render, so focus stays put).
      if (state.errors[field] && !validateField(field, el.value)) {
        delete state.errors[field];
        var wrap = app.querySelector('[data-fieldwrap="' + field + '"]');
        if (wrap) wrap.classList.remove('invalid');
        el.removeAttribute('aria-invalid');
      }
      save();
      return;
    }
    var sf = el.getAttribute && el.getAttribute('data-sfield');
    if (sf) { state.staffForm[sf] = el.value; save(); }
  }
  document.addEventListener('input', onField);
  document.addEventListener('change', onField);

  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var form = ev.target;
    var kind = form.getAttribute('data-form');

    if (kind === 'booking') {
      var errs = {};
      ['name', 'email', 'age'].forEach(function (k) { var e = validateField(k, state.form[k]); if (e) errs[k] = e; });
      state.errors = errs;
      if (Object.keys(errs).length) {
        render();
        var first = app.querySelector('[aria-invalid="true"]');
        if (first) first.focus();
        return;
      }
      var slot = findSlot(state.selectedSlotId);
      if (!slot || remaining(slot) === 0 || !bookable(slot)) {
        state.slotTaken = true;
        state.selectedSlotId = null;
        state.screen = 'slots';
        render({ top: true });
        return;
      }
      var b = {
        id: 'TR-' + state.nextNo++,
        slotId: slot.id,
        parentName: state.form.name.trim(),
        email: state.form.email.trim(),
        childAge: Number(state.form.age),
        lang: state.lang,
        createdAt: new Date().toISOString(),
        isNew: true
      };
      state.bookings.push(b);
      state.lastBookingId = b.id;
      state.form = { name: '', email: '', age: '' };
      state.errors = {};
      state.selectedSlotId = null;
      state.screen = 'done';
      render({ top: true });
    }

    if (kind === 'slot') {
      var f = state.staffForm, e = {};
      var cap = parseInt(f.capacity, 10);
      if (!f.date) e.date = '日付を選択してください';
      else if (f.date < todayIso()) e.date = '今日以降の日付を選択してください';
      if (!f.time) e.time = '開始時刻を入力してください';
      if (!f.capacity) e.capacity = '定員を入力してください';
      else if (!(cap >= 1 && cap <= 12)) e.capacity = '1〜12の数字で入力してください';
      if (!e.date && !e.time && state.slots.some(function (s) { return s.date === f.date && s.time === f.time; })) {
        e.time = 'この日時の枠はすでにあります';
      }
      state.staffErrors = e;
      state.staffAdded = null;
      if (Object.keys(e).length) { render(); return; }
      var ns = { id: 'n' + Date.now(), date: f.date, time: f.time, capacity: cap, isNew: true };
      state.slots.push(ns);
      state.staffAdded = slotLabel(ns, 'ja');
      state.staffForm = { date: '', time: f.time, capacity: String(DEFAULT_CAPACITY) };
      render();
    }
  });

  // The staff screen opens at #staff (e.g. stylish.html#staff); everything else is the parent site.
  function viewFromUrl() { return location.hash === '#staff' ? 'staff' : 'parent'; }
  state.view = viewFromUrl();
  window.addEventListener('hashchange', function () {
    var v = viewFromUrl();
    if (v !== state.view) { state.view = v; render({ top: true }); }
  });

  render();
})();
</script>
</body>
</html>
