<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>制作実績 | Lumineglyph</title>
<meta name="description" content="Lumineglyphがこれまでに制作したWebサイトの一覧です。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Noto+Sans+JP:wght@400;500&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
/* ?theme=dark / ?theme=light を付けると、OSの設定に関係なくその配色で表示（比較用） */
(function(){try{var t=new URLSearchParams(location.search).get("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<style>
/* ===== 実績一覧ページ専用 ===== */
.w-header{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;
  height:72px;padding:0 40px;background:var(--header-bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--faint);
}
.w-brand{display:flex;align-items:center;text-decoration:none;min-width:0}
.w-brand img{height:30px;width:auto;max-width:100%}
.w-actions{display:flex;align-items:center;gap:22px}
.w-back{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;color:var(--muted);white-space:nowrap}
.w-back svg{width:16px;height:16px}
.w-back:hover{color:var(--accent)}
.w-main{max-width:1080px;margin:0 auto;padding:96px 48px 0}
.w-intro{max-width:640px}
.w-title{font-family:var(--serif-jp);font-weight:400;font-size:34px;line-height:1.5;margin-top:18px;letter-spacing:.06em}
html[lang="en"] .w-title{font-family:var(--serif-en);font-size:44px;line-height:1.15;letter-spacing:0;font-weight:500}
.w-count{margin-top:12px;font-family:var(--serif-en);font-size:16px;color:var(--muted);letter-spacing:.04em}
.w-main .works-grid{margin-top:64px;gap:64px 40px}
.w-cta{margin:120px auto 0;max-width:640px;text-align:center;padding:56px 32px;border:1px solid var(--line)}
.w-cta .g{width:44px;height:44px;margin:0 auto 18px;color:var(--deco-mid)}
.w-cta h2{font-family:var(--serif-en);font-weight:400;font-size:40px;line-height:1.1}
.w-cta p{margin-top:16px;color:var(--muted);font-size:14.5px}
.w-cta .btn{margin-top:28px}
.w-main .footer{margin-top:96px;padding-bottom:40px}
@media (max-width:640px){
  .w-header{height:60px;padding:0 16px;gap:10px}
  .w-brand img{height:20px}
  .w-actions{gap:10px}
  .w-back .lb{display:none}
  .w-back{width:36px;height:36px;justify-content:center;border:1px solid var(--line);border-radius:50%}
  .w-main{padding:56px 22px 0}
  .w-title{font-size:26px}
  html[lang="en"] .w-title{font-size:34px}
  .w-main .works-grid{margin-top:44px;gap:44px}
  .w-cta{margin-top:88px;padding:44px 22px}
  .w-cta h2{font-size:34px}
  .w-cta .btn{width:100%}
}
</style>
</head>
<body>
<!-- ===== 太陽・月・軌道の線画（ロゴのモチーフ） ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="g-sun" viewBox="0 0 200 200"><circle cx="100" cy="100" r="42"/><path d="M151.9 103.6L197.8 106.8M149.2 116.9L160.5 120.8M143.1 129.1L169.6 147.0M134.1 139.2L145.9 152.8M122.8 146.7L140.3 182.7M109.9 151.0L111.4 158.9M96.4 151.9L94.4 179.8M83.1 149.2L75.9 170.0M70.9 143.1L45.2 181.2M60.8 134.1L51.7 142.0M53.3 122.8L24.5 136.8M49.0 109.9L31.3 113.4M48.1 96.4L8.2 93.6M50.8 83.1L43.3 80.5M56.9 70.9L33.7 55.3M65.9 60.8L51.5 44.2M77.2 53.3L57.0 11.9M90.1 49.0L87.8 37.2M103.6 48.1L105.9 16.2M116.9 50.8L122.8 33.8M129.1 56.9L151.4 23.7M139.2 65.9L145.3 60.6M146.7 77.2L171.9 64.9M151.0 90.1L172.6 85.9"/></symbol>
  <symbol id="g-sun-s" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M19 12L23 12M16.95 16.95L19.78 19.78M12 19L12 23M7.05 16.95L4.22 19.78M5 12L1 12M7.05 7.05L4.22 4.22M12 5L12 1M16.95 7.05L19.78 4.22"/></symbol>
  <symbol id="g-sun-fill" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.4" fill="currentColor" stroke="none"/><path d="M12.00 4.40L12.00 0.80M17.37 6.63L19.92 4.08M19.60 12.00L23.20 12.00M17.37 17.37L19.92 19.92M12.00 19.60L12.00 23.20M6.63 17.37L4.08 19.92M4.40 12.00L0.80 12.00M6.63 6.63L4.08 4.08" style="stroke-width:1.7px"/></symbol>
  <symbol id="g-moon" viewBox="0 0 200 200"><path d="M91.4 30.5A70 70 0 1 0 158.7 138.2A64 64 0 0 1 91.4 30.5Z"/></symbol>
  <symbol id="g-orbit" viewBox="0 0 400 210"><path d="M4 70A100 100 0 0 1 196.5 86.6"/><path d="M203.5 117.4A100 100 0 0 0 396 134"/><circle cx="200" cy="102" r="3.2" class="dot"/></symbol>
</svg>

<header class="w-header">
  <a class="w-brand" id="to-top-logo" href="index.html"><img class="on-dark" src="assets/logo-symboltype-white.png" alt="Lumineglyph Design"><img class="on-light" src="assets/logo-symboltype-black.png" alt="Lumineglyph Design"></a>
  <div class="w-actions">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ja" aria-pressed="true">JP</button><span class="sep" aria-hidden="true">/</span><button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <a class="w-back" id="back-top" href="index.html#works"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"/></svg><span class="lb">Top</span><span class="sr-only" data-t="backSr">トップページに戻る</span></a>
  </div>
</header>

<main class="w-main">
  <section class="w-intro">
    <p class="eyebrow"><svg class="g" aria-hidden="true"><use href="#g-sun-s"/></svg>Works</p>
    <h1 class="w-title" data-t="title">制作実績</h1>
    <p class="lead" data-t="lead">これまでに制作したWebサイトをご紹介します。各サイトは新しいタブで開きます。</p>
    <p class="w-count" id="w-count"></p>
  </section>

  <!-- 実績は works.js の WORKS から自動で表示されます -->
  <div class="works-grid" id="works-all"></div>

  <section class="w-cta">
    <svg class="g fill" aria-hidden="true" viewBox="0 0 200 200"><use href="#g-moon"/></svg>
    <h2>Contact Us</h2>
    <p data-t="ctaText">制作のご相談は、日本語・英語のどちらでもお気軽にどうぞ。</p>
    <a class="btn btn-primary" id="to-contact" href="index.html#contact"><span data-t="ctaBtn">制作の相談をする</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg></a>
  </section>

  <footer class="footer">
    <span class="fbrand"><img class="on-dark" src="assets/logo-symboltype-white.png" alt="Lumineglyph Design"><img class="on-light" src="assets/logo-symboltype-black.png" alt="Lumineglyph Design"></span>
    <span>© 2026 Lumineglyph</span>
  </footer>
</main>

<script src="works.js"></script>
<script>
const T = {
  ja:{ docTitle:"制作実績 | Lumineglyph", title:"制作実績", lead:"これまでに制作したWebサイトをご紹介します。各サイトは新しいタブで開きます。",
       count:n=>n+" Works", ctaText:"制作のご相談は、日本語・英語のどちらでもお気軽にどうぞ。", ctaBtn:"制作の相談をする", backSr:"トップページに戻る" },
  en:{ docTitle:"Works | Lumineglyph", title:"Selected Works", lead:"Here are some of the websites we have designed and built. Each site opens in a new tab.",
       count:n=>n+(n===1?" Work":" Works"), ctaText:"Have a project in mind? Feel free to reach out in Japanese or English.", ctaBtn:"Discuss Your Project", backSr:"Back to the top page" }
};
let lang = initialLang();
function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.docTitle;
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = t[el.dataset.t]; });
  document.getElementById("works-all").innerHTML = WORKS.map(w=>workCardHTML(w, lang)).join("");
  document.getElementById("w-count").textContent = t.count(WORKS.length);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
  document.getElementById("back-top").href   = pageLink("index.html", lang, "#works");
  document.getElementById("to-top-logo").href = pageLink("index.html", lang);
  document.getElementById("to-contact").href  = pageLink("index.html", lang, "#contact");
  // URLにも言語を残す（再読み込みしても同じ言語で表示）
  try{ history.replaceState(null, "", pageLink("works.html", lang)); }catch(e){}
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{ if(b.dataset.lang!==lang){ lang=b.dataset.lang; render(); } }));
render();
</script>
</body>
</html>
