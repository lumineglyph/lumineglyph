version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    # Wait 7 days after a release before proposing it. Most malicious releases are caught and
    # pulled within days. Security fixes skip this wait.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore # → "chore(deps): bump …" and "chore(deps-dev): bump …"
      include: scope
    # One PR per group instead of one per package
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      fontsource:
        patterns: ["@fontsource/*"]
    # @astrojs/check (the type checker) supports TypeScript 5 and 6 only (0.9.12, checked 2026-11-18).
    # Remove this once a release supports 7: `npm view @astrojs/check peerDependencies`.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci # → "ci: bump actions/checkout …"
  # terraform
  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/main
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  # scanners used by the security job
  - package-ecosystem: pip
    directory: /.github/scanners
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
